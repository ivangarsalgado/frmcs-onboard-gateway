
services:

  # Base de datos de abonados 5G
  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks:
      - 5g-net

  # Open5GS - Access and Mobility Management
  amf:
    build: ./core-open5gs
    image: frmcs-open5gs:latest
    command: open5gs-amfd -c /etc/open5gs/amf.yaml
    networks:
      5g-net:
        ipv4_address: 172.25.0.10
    volumes:
      - ./core-open5gs/config/amf.yaml:/etc/open5gs/amf.yaml:ro

  # Open5GS - Session Management
  smf:
    image: frmcs-open5gs:latest
    command: open5gs-smfd -c /etc/open5gs/smf.yaml
    networks:
      5g-net:
        ipv4_address: 172.25.0.11
    volumes:
      - ./core-open5gs/config/smf.yaml:/etc/open5gs/smf.yaml:ro

  # Open5GS - User Plane
  upf:
    image: frmcs-open5gs:latest
    command: open5gs-upfd -c /etc/open5gs/upf.yaml
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      5g-net:
        ipv4_address: 172.25.0.12
    volumes:
      - ./core-open5gs/config/upf.yaml:/etc/open5gs/upf.yaml:ro
  
  # Open5GS - NRF
  nrf:
    image: frmcs-open5gs:latest
    command: "open5gs-nrfd -c /etc/open5gs/nrf.yaml"
    networks:
      5g-net:
        ipv4_address: 172.25.0.14
    volumes:
      - ./core-open5gs/config/nrf.yaml:/etc/open5gs/nrf.yaml:ro

  # Open5GS - Authentication Server Function
  ausf:
    image: frmcs-open5gs:latest
    command: open5gs-ausfd -c /etc/open5gs/ausf.yaml
    depends_on:
      - nrf
    networks:
      5g-net:
        ipv4_address: 172.25.0.15
    volumes:
      - ./core-open5gs/config/ausf.yaml:/etc/open5gs/ausf.yaml:ro

  # Open5GS - Unified Data Management
  udm:
    image: frmcs-open5gs:latest
    command: open5gs-udmd -c /etc/open5gs/udm.yaml
    depends_on:
      - nrf
    networks:
      5g-net:
        ipv4_address: 172.25.0.16
    volumes:
      - ./core-open5gs/config/udm.yaml:/etc/open5gs/udm.yaml:ro

  # Open5GS - Unified Data Repository
  udr:
    image: frmcs-open5gs:latest
    command: open5gs-udrd -c /etc/open5gs/udr.yaml
    depends_on:
      - nrf
      - mongodb
    networks:
      5g-net:
        ipv4_address: 172.25.0.17
    volumes:
      - ./core-open5gs/config/udr.yaml:/etc/open5gs/udr.yaml:ro

  # UERANSIM - Estacion base
  gnb:
    build: ./client-ueransim
    image: frmcs-ueransim:latest
    command: ./build/nr-gnb -c config/open5gs-gnb.yaml
    networks:
      5g-net:
        ipv4_address: 172.25.0.20
    volumes:
      - ./client-ueransim/config/open5gs-gnb.yaml:/ueransim/config/open5gs-gnb.yaml:ro

  # UERANSIM - Modem 5G
  ue:
    image: frmcs-ueransim:latest
    command: ./build/nr-ue -c config/open5gs-ue.yaml
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      5g-net:
        ipv4_address: 172.25.0.21

volumes:
  mongo-data:

networks:
  5g-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
